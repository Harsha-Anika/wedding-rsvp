<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RSVP · Harsha & Anika </title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  /* ====== EDIT COLOURS HERE ====== */
  :root {
    --bg: #f7f3ee;
    --card: #fffdfa;
    --ink: #2f2a26;
    --muted: #7a6f66;
    --accent: #8a9a7b;      /* sage */
    --accent-dark: #6d7d5f;
    --line: #e4dcd2;
    --error: #a8473b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Jost", system-ui, sans-serif;
    font-weight: 300;
    line-height: 1.6;
  }
  main { max-width: 640px; margin: 0 auto; padding: 56px 16px 80px; }
  header { text-align: center; margin-bottom: 40px; }
  .eyebrow { letter-spacing: .3em; text-transform: uppercase; font-size: .75rem; color: var(--muted); }
  h1 {
    font-family: "Cormorant Garamond", serif;
    font-weight: 400;
    font-size: clamp(2.6rem, 9vw, 4rem);
    line-height: 1.05;
    margin: 12px 0 8px;
  }
  h1 em { color: var(--accent-dark); font-style: italic; }
  .details { font-size: 1rem; color: var(--muted); }
  .divider { width: 60px; height: 1px; background: var(--accent); margin: 24px auto; }
  .deadline { font-family: "Cormorant Garamond", serif; font-style: italic; font-size: 1.2rem; }

  form {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 32px 24px;
  }
  .field { margin-bottom: 22px; }
  label, legend { display: block; font-weight: 500; font-size: .9rem; margin-bottom: 6px; }
  .hint { font-weight: 300; color: var(--muted); font-size: .85rem; }
  input[type=text], input[type=email], input[type=number], textarea, select {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: #fff;
    font: inherit;
    color: var(--ink);
  }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
  textarea { min-height: 90px; resize: vertical; }
  fieldset { border: 0; padding: 0; margin: 0 0 22px; }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .choice input { position: absolute; opacity: 0; }
  .choice span {
    display: block; text-align: center; padding: 14px 10px;
    border: 1px solid var(--line); border-radius: 4px; cursor: pointer;
    background: #fff; transition: all .15s;
  }
  .choice input:checked + span { background: var(--accent); border-color: var(--accent); color: #fff; }
  .choice input:focus-visible + span { outline: 2px solid var(--accent-dark); outline-offset: 2px; }
  .attending-only { display: none; }
  .attending-only.show { display: block; }
  .hp { position: absolute; left: -9999px; }   /* spam trap */

  button {
    width: 100%; padding: 15px; border: 0; border-radius: 4px;
    background: var(--ink); color: #fff; font: inherit; font-weight: 500;
    letter-spacing: .15em; text-transform: uppercase; cursor: pointer;
  }
  button:hover { background: var(--accent-dark); }
  button:disabled { opacity: .6; cursor: wait; }
  .status { margin-top: 16px; text-align: center; min-height: 1.5em; }
  .status.error { color: var(--error); }

  .thanks { display: none; text-align: center; background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 48px 24px; }
  .thanks h2 { font-family: "Cormorant Garamond", serif; font-weight: 400; font-size: 2.4rem; margin: 0 0 8px; }
  footer { text-align: center; margin-top: 32px; color: var(--muted); font-size: .85rem; }
</style>
</head>
<body>
<main>
  <!-- ====== EDIT YOUR DETAILS HERE ====== -->
  <header>
    <div class="eyebrow">Together with their families</div>
    <h1> Harsha <em>&amp;</em> Anika </h1>
    <div class="details">5th June 2027 · Easthampstead Park </div>
    <div class="divider"></div>
    <div class="deadline"> Kindly reply by 1 February 2027 </div>
  </header>

  <form id="rsvp" novalidate>
    <div class="field">
      <label for="name">Your full name</label>
      <input type="text" id="name" name="name" autocomplete="name" required>
    </div>

    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="email" required>
    </div>

    <fieldset>
      <legend>Will you be joining us?</legend>
      <div class="choices">
        <label class="choice"><input type="radio" name="attending" value="Yes" required><span>Joyfully accepts</span></label>
        <label class="choice"><input type="radio" name="attending" value="No"><span>Regretfully declines</span></label>
      </div>
    </fieldset>

    <div class="attending-only" id="attendingFields">
      <div class="field">
        <label for="guests">Number of guests <span class="hint">(including you)</span></label>
        <select id="guests" name="guests">
          <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
        </select>
      </div>

      <div class="field">
        <label for="guest_names">Names of other guests <span class="hint">(if any)</span></label>
        <input type="text" id="guest_names" name="guest_names">
      </div>

      <div class="field">
        <label for="dietary">Dietary requirements or allergies</label>
        <input type="text" id="dietary" name="dietary" placeholder="e.g. vegetarian, nut allergy">
      </div>

      <div class="field">
        <label for="song">A song that'll get you on the dance floor</label>
        <input type="text" id="song" name="song">
      </div>
    </div>

    <div class="field">
      <label for="message">A note for the couple <span class="hint">(optional)</span></label>
      <textarea id="message" name="message"></textarea>
    </div>

    <!-- spam trap: real people never see or fill this -->
    <div class="hp" aria-hidden="true">
      <label for="website">Leave blank</label>
      <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
    </div>

    <button type="submit" id="submitBtn">Send RSVP</button>
    <div class="status" id="status" role="status" aria-live="polite"></div>
  </form>

  <div class="thanks" id="thanks">
    <h2>Thank you</h2>
    <p id="thanksMsg">Your RSVP has been received.</p>
  </div>

  <footer>Questions? Contact us at [your email]</footer>
</main>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycb.../exec";

  const form = document.getElementById("rsvp");
  const statusEl = document.getElementById("status");
  const btn = document.getElementById("submitBtn");
  const attendingFields = document.getElementById("attendingFields");

  form.querySelectorAll('input[name="attending"]').forEach(r =>
    r.addEventListener("change", () =>
      attendingFields.classList.toggle("show", form.attending.value === "Yes")
    )
  );

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    statusEl.className = "status";

    if (!form.name.value.trim() || !form.email.checkValidity() || !form.attending.value) {
      statusEl.textContent = "Please add your name, a valid email, and let us know if you can come.";
      statusEl.classList.add("error");
      return;
    }

    const data = new URLSearchParams(new FormData(form));
    if (form.attending.value === "No") {
      ["guests", "guest_names", "dietary", "song"].forEach(k => data.set(k, ""));
      data.set("guests", "0");
    }

    btn.disabled = true;
    btn.textContent = "Sending…";

    try {
      const res = await fetch(SCRIPT_URL, { method: "POST", body: data });
      const json = await res.json();
      if (json.result !== "success") throw new Error(json.error || "Unknown error");

      form.style.display = "none";
      document.getElementById("thanksMsg").textContent =
        form.attending.value === "Yes"
          ? "We can't wait to celebrate with you!"
          : "We'll miss you, and thank you for letting us know.";
      document.getElementById("thanks").style.display = "block";
    } catch (err) {
      statusEl.textContent = "Something went wrong. Please try again, or contact us directly.";
      statusEl.classList.add("error");
      btn.disabled = false;
      btn.textContent = "Send RSVP";
    }
  });
</script>
</body>
</html>
